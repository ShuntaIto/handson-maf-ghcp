[project]
name = "handson-maf-ghcp"
version = "0.1.0"
description = "A Foundry Hosted Agent that implements and validates one coding hypothesis."
readme = "README.md"
authors = [
    { name = "ShuntaIto", email = "shunta.ito@microsoft.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.19.0",
    "agent-framework-foundry>=1.13.1",
    "agent-framework-foundry-hosting>=1.0.0b260918",
    "agent-framework-github-copilot>=2.0.0",
    "agent-framework-orchestrations>=1.2.0",
    "azure-identity>=1.25.3",
    "github-copilot-sdk>=1.0.11",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "small: single process, no network, no model calls",
    "medium: local container over localhost, requires Docker",
    "large: calls the real model (local script, local container, Hosted Agent), requires Azure",
]
